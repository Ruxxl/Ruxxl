58 209.0 l6 5 l-6 5" stroke="#39d353" stroke-width="2" fill="none"/></g><g style="opacity:0;animation:slide .7s cubic-bezier(.2,.8,.3,1) 1.4s both"><rect x="16" y="262" width="808" height="76" rx="10" fill="#0f1211" stroke="#1d2421"/><rect x="16" y="272" width="3" height="56" rx="1.5" fill="#39d353"/><g clip-path="url(#cc2)"><rect y="262" x="0" width="120" height="76" fill="#39d353" opacity=".10" style="animation:sweep 1.4s ease-in-out 1.5999999999999999s both"/></g><text x="40" y="294" font-size="13" class="tx f" style="animation-delay:1.7s">Спор: виноваты бэкенд,</text><text x="40" y="314" font-size="13" class="tx f" style="animation-delay:1.7s">сеть или фронт</text><text x="312" y="294" font-size="13" class="tx f" style="animation-delay:1.95s">M Performance: разбор</text><text x="312" y="314" font-size="13" class="tx f" style="animation-delay:1.95s">времени экрана</text><text x="584" y="294" font-size="13" class="gr f" style="animation-delay:2.2s">Причина тормозов видна</text><text x="584" y="314" font-size="13" class="gr f" style="animation-delay:2.2s">в цифрах</text><path d="M268 300.0 h22" stroke="#39d353" stroke-width="2" stroke-dasharray="4 4" fill="none" style="animation:dash .8s linear infinite"/><path d="M286 295.0 l6 5 l-6 5" stroke="#39d353" stroke-width="2" fill="none"/><path d="M540 300.0 h22" stroke="#39d353" stroke-width="2" stroke-dasharray="4 4" fill="none" style="animation:dash .8s linear infinite"/><path d="M558 295.0 l6 5 l-6 5" stroke="#39d353" stroke-width="2" fill="none"/></g><g style="opacity:0;animation:slide .7s cubic-bezier(.2,.8,.3,1) 1.85s both"><rect x="16" y="348" width="808" height="76" rx="10" fill="#0f1211" stroke="#1d2421"/><rect x="16" y="358" width="3" height="56" rx="1.5" fill="#39d353"/><g clip-path="url(#cc3)"><rect y="348" x="0" width="120" height="76" fill="#39d353" opacity=".10" style="animation:sweep 1.4s ease-in-out 2.0500000000000003s both"/></g><text x="40" y="380" font-size="13" class="tx f" style="animation-delay:2.